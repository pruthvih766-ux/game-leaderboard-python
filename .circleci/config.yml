
version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Ruff
          command: pip install ruff
      - run:
          name: Lint Python code
          command: ruff check app tests

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run unit tests
          command: python -m unittest discover -s tests -p "test_scoring.py" -v

  integration-tests:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: leaderboard
          POSTGRES_PASSWORD: leaderboard_dev_password
          POSTGRES_DB: leaderboard
      - image: cimg/redis:7.2
    environment:
      DATABASE_URL: postgresql://leaderboard:leaderboard_dev_password@localhost:5432/leaderboard
      REDIS_URL: redis://localhost:6379/0
    steps:
      - checkout

      - run:
          name: Install database client tools
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client redis-tools

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if pg_isready -h localhost -U leaderboard -d leaderboard; then
                break
              fi
              sleep 2
            done
            pg_isready -h localhost -U leaderboard -d leaderboard

      - run:
          name: Wait for Redis
          command: |
            for i in $(seq 1 30); do
              if redis-cli -h localhost ping | grep -q PONG; then
                exit 0
              fi
              sleep 2
            done
            echo "Redis failed to start"
            exit 1

      - run:
          name: Install Python dependencies
          command: pip install -r requirements.txt

      - run:
          name: Apply database migrations
          command: |
            PGPASSWORD=leaderboard_dev_password psql \
              -h localhost -U leaderboard -d leaderboard \
              -v ON_ERROR_STOP=1 -f migrations/001_schema.sql
            PGPASSWORD=leaderboard_dev_password psql \
              -h localhost -U leaderboard -d leaderboard \
              -v ON_ERROR_STOP=1 -f migrations/002_seed.sql

      - run:
          name: Start API
          command: uvicorn app.main:app --host 0.0.0.0 --port 8080
          background: true

      - run:
          name: Wait for API
          command: |
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/health; then
                exit 0
              fi
              sleep 2
            done
            echo "API failed to start"
            exit 1

      - run:
          name: Run integration tests
          command: python -m unittest discover -s tests -p "test_integration.py" -v

  secret-scan:
    docker:
      - image: cimg/go:1.23
    steps:
      - checkout
      - run:
          name: Install Gitleaks
          command: |
            GITLEAKS_VERSION=8.30.1
            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run:
          name: Scan repository
          command: /tmp/gitleaks git .

  docker-publish:
    parameters:
      moving_tag:
        type: enum
        enum: ["qa", "stage", "prod"]
      immutable_prefix:
        type: enum
        enum: ["main", "staging", "prod"]
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and push Docker Hub images
          command: |
            set -euo pipefail

            if [ -z "${DOCKERHUB_USER:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
              echo "ERROR: DOCKERHUB_USER and DOCKERHUB_TOKEN must be set as"
              echo "       non-empty environment variables in your CircleCI project"
              echo "       settings (Project Settings → Environment Variables)."
              exit 1
            fi

            IMAGE="${DOCKERHUB_USER}/game-leaderboard-python"
            SHORT_SHA=$(echo "${CIRCLE_SHA1}" | cut -c1-7)

            printf '%s' "${DOCKERHUB_TOKEN}" | docker login \
              --username "${DOCKERHUB_USER}" \
              --password-stdin

            docker build \
              -t "${IMAGE}:<< parameters.moving_tag >>" \
              -t "${IMAGE}:<< parameters.immutable_prefix >>-${SHORT_SHA}" \
              .

            docker push "${IMAGE}:<< parameters.moving_tag >>"
            docker push "${IMAGE}:<< parameters.immutable_prefix >>-${SHORT_SHA}"

            docker logout

workflows:
  leaderboard-ci:
    jobs:
      - lint:
          filters:
            branches:
              only: main

      - unit-tests:
          filters:
            branches:
              only: main

      - integration-tests:
          requires:
            - unit-tests
          filters:
            branches:
              only: main

      - secret-scan:
          filters:
            branches:
              only: main

      - docker-publish:
          name: publish-qa
          moving_tag: qa
          immutable_prefix: main
          requires:
            - lint
            - unit-tests
            - integration-tests
            - secret-scan
          filters:
            branches:
              only: main

      - docker-publish:
          name: publish-stage
          moving_tag: stage
          immutable_prefix: staging
          filters:
            branches:
              only: staging

      - docker-publish:
          name: publish-prod
          moving_tag: prod
          immutable_prefix: prod
          filters:
            branches:
              only: prod
